name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_OPTS: -Dmaven.repo.local=${{ github.workspace }}/.m2/repository

jobs:
  changes:
    name: Detect changed subsystems
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.filter.outputs.go }}
      helm: ${{ steps.filter.outputs.helm }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect scoped changes
        id: filter
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base_sha="${EVENT_BASE_SHA}"
          if [[ -z "${base_sha}" || "${base_sha}" =~ ^0+$ ]]; then
            base_sha="$(git rev-list --max-parents=0 HEAD)"
          fi
          if git diff --quiet "${base_sha}" HEAD -- control-plane; then
            echo "go=false" >> "${GITHUB_OUTPUT}"
          else
            echo "go=true" >> "${GITHUB_OUTPUT}"
          fi
          if git diff --quiet "${base_sha}" HEAD -- deployment/helm; then
            echo "helm=false" >> "${GITHUB_OUTPUT}"
          else
            echo "helm=true" >> "${GITHUB_OUTPUT}"
          fi

  java:
    name: Java 21 Maven verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Maven reactor
        run: mvn -B -ntp verify -DskipITs

      - name: Check Java formatting
        run: mvn -B -ntp spotless:check

  go:
    name: Go checks
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module:
          - control-plane
          - control-plane/api-server
          - control-plane/controller
          - control-plane/scheduler
          - control-plane/catalog
          - control-plane/auth
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true
          cache-dependency-path: |
            control-plane/go.mod
            control-plane/api-server/go.mod
            control-plane/controller/go.mod
            control-plane/scheduler/go.mod
            control-plane/catalog/go.mod
            control-plane/auth/go.mod

      - name: Download dependencies
        working-directory: ${{ matrix.module }}
        run: go mod download

      - name: Format check
        working-directory: ${{ matrix.module }}
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test ./...

  protocols:
    name: Protocol and YAML validation
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate XML and protobuf modules
        run: mvn -B -ntp -pl protocol -am validate

      - name: Set up Helm
        if: needs.changes.outputs.helm == 'true'
        uses: azure/setup-helm@v5
        with:
          version: v3.15.4

      - name: Lint Helm chart
        if: needs.changes.outputs.helm == 'true'
        run: helm lint deployment/helm/astrasync

  repository:
    name: Repository policy checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f CONTRIBUTING.md
          test -f LICENSE
          test -f pom.xml
          test -f .commitlintrc
          test -f .githooks/commit-msg

      - name: Check for accidental secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

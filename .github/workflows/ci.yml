name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed subsystems
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.filter.outputs.go }}
      java: ${{ steps.filter.outputs.java }}
      helm: ${{ steps.filter.outputs.helm }}
      docs: ${{ steps.filter.outputs.docs }}
      multi_region: ${{ steps.filter.outputs.multi_region }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect scoped changes
        id: filter
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base_sha="${EVENT_BASE_SHA}"
          if [[ -z "${base_sha}" || "${base_sha}" =~ ^0+$ ]]; then
            base_sha="$(git rev-list --max-parents=0 HEAD)"
          fi
          if git diff --quiet "${base_sha}" HEAD -- control-plane console; then
            echo "go=false" >> "${GITHUB_OUTPUT}"
          else
            echo "go=true" >> "${GITHUB_OUTPUT}"
          fi
          if git diff --quiet "${base_sha}" HEAD -- engine connectors formats transforms protocol connector-api cli pom.xml; then
            echo "java=false" >> "${GITHUB_OUTPUT}"
          else
            echo "java=true" >> "${GITHUB_OUTPUT}"
          fi
          if git diff --quiet "${base_sha}" HEAD -- deployment/helm; then
            echo "helm=false" >> "${GITHUB_OUTPUT}"
          else
            echo "helm=true" >> "${GITHUB_OUTPUT}"
          fi
          if git diff --quiet "${base_sha}" HEAD -- docs runbooks scripts; then
            echo "docs=false" >> "${GITHUB_OUTPUT}"
          else
            echo "docs=true" >> "${GITHUB_OUTPUT}"
          fi
          if git diff --quiet "${base_sha}" HEAD -- \
            tests/integration \
            scripts/run-multi-region-acceptance.py \
            Makefile \
            api/protobuf \
            protocol \
            deployment/docker; then
            echo "multi_region=false" >> "${GITHUB_OUTPUT}"
          else
            echo "multi_region=true" >> "${GITHUB_OUTPUT}"
          fi

  java:
    name: Java 21 Maven verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Maven reactor
        run: mvn -B -ntp verify -DskipITs

      - name: Check deployment connector inventory
        env:
          CATALOG_BUILD_VERSION: ${{ github.sha }}
        run: |
          mkdir -p target/catalog-check
          java -jar cli/target/astrasync-cli-0.1.0-SNAPSHOT-all.jar \
            catalog-export target/catalog-check/connector-inventory.pb \
            --compiler-build $CATALOG_BUILD_VERSION \
            --execution-profile standard
          if python scripts/check-files-identical.py deployment/catalog/connector-inventory.pb target/catalog-check/connector-inventory.pb; then
            echo "catalog-check passed"
          else
            echo "::error::Committed catalog differs from freshly-exported catalog"
            echo "::error::Running diff-catalog for diagnostics..."
            python scripts/diff-catalog.py deployment/catalog/connector-inventory.pb target/catalog-check/connector-inventory.pb || true
            exit 1
          fi

      - name: Check Java formatting
        run: mvn -B -ntp spotless:check

      - name: Run Arrow benchmark smoke
        run: >-
          java --add-opens=java.base/java.nio=ALL-UNNAMED
          -jar tests/benchmark/target/astrasync-benchmarks.jar
          ArrowBatchBenchmark -wi 0 -i 1 -f 1 -r 100ms -p rowCount=128

      - name: Run adaptive controller benchmark smoke
        run: >-
          java -jar tests/benchmark/target/astrasync-benchmarks.jar
          AdaptiveControllerBenchmark -wi 0 -i 1 -f 1 -r 100ms

      - name: Run spill exchange benchmark smoke
        run: >-
          java -jar tests/benchmark/target/astrasync-benchmarks.jar
          SpillExchangeBenchmark -wi 0 -i 1 -f 1 -r 100ms

  go:
    name: Go checks
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module:
          - control-plane
          - control-plane/api-server
          - control-plane/controller
          - control-plane/scheduler
          - control-plane/catalog
          - control-plane/auth
          - console
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: |
            control-plane/go.mod
            control-plane/api-server/go.mod
            control-plane/controller/go.mod
            control-plane/scheduler/go.mod
            control-plane/catalog/go.mod
            control-plane/auth/go.mod
            console/go.mod
            console/go.sum

      - name: Download dependencies
        working-directory: ${{ matrix.module }}
        run: go mod download

      - name: Format check
        working-directory: ${{ matrix.module }}
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test ./...

  go-postgres:
    name: PostgreSQL repository integration
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: astrasync
          POSTGRES_USER: astra
          POSTGRES_PASSWORD: astra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astra -d astrasync"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: |
            control-plane/go.sum
            control-plane/controller/go.sum
            control-plane/scheduler/go.sum

      - name: Run PostgreSQL lifecycle integration
        working-directory: control-plane
        env:
          ASTRASYNC_TEST_POSTGRES_URL: postgres://astra:astra@127.0.0.1:5432/astrasync?sslmode=disable
        run: >-
          go test -v -count=1 ./job/postgres
          -run '^Test(RepositoryPersistsLifecycleAcrossConnections|AtomicJobMutationsFenceConnectionGenerations)$'

      - name: Run PostgreSQL connector catalog integration
        working-directory: control-plane/catalog
        env:
          ASTRASYNC_TEST_POSTGRES_URL: postgres://astra:astra@127.0.0.1:5432/astrasync?sslmode=disable
        run: go test -v -count=1 ./postgres -run '^TestRepositoryAtomicallyActivatesCatalog$'

      - name: Run PostgreSQL authentication integration
        working-directory: control-plane/auth
        env:
          ASTRASYNC_TEST_POSTGRES_URL: postgres://astra:astra@127.0.0.1:5432/astrasync?sslmode=disable
        run: go test -v -count=1 ./postgres -run '^TestRepositoryMaterializesOIDCIdentityAndTenantMembership$'

      - name: Run PostgreSQL Connection lifecycle integration
        working-directory: control-plane
        env:
          ASTRASYNC_TEST_POSTGRES_URL: postgres://astra:astra@127.0.0.1:5432/astrasync?sslmode=disable
        run: >-
          go test -v -count=1 ./connection/postgres
          -run '^TestRepository(PersistsAtomicConnectionLifecycle|FencesConcurrentConnectionTestExecutors)$'

      - name: Run PostgreSQL credential materialization integration
        working-directory: control-plane/scheduler
        env:
          ASTRASYNC_TEST_POSTGRES_URL: postgres://astra:astra@127.0.0.1:5432/astrasync?sslmode=disable
        run: >-
          go test -v -count=1 ./internal/materialization/postgres
          -run '^TestStorePersistsLeaseFencedMaterializationReceiptsAndCleanup$'

      - name: Run PostgreSQL scheduler admission integration
        working-directory: control-plane/scheduler
        env:
          ASTRASYNC_TEST_POSTGRES_URL: postgres://astra:astra@127.0.0.1:5432/astrasync?sslmode=disable
        run: go test -v -count=1 ./internal/dispatch/postgres -run '^TestStoreSerializesCapacityAndFencesLeaseAndHeartbeatTakeover$'

      - name: Run PostgreSQL Controller convergence integration
        working-directory: control-plane/controller
        env:
          ASTRASYNC_TEST_POSTGRES_URL: postgres://astra:astra@127.0.0.1:5432/astrasync?sslmode=disable
        run: go test -v -count=1 ./internal/controller -run '^TestReconcilerConvergesSyncJobWithPostgres$'

      - name: Run PostgreSQL replication adapter integration
        working-directory: control-plane
        env:
          ASTRASYNC_TEST_POSTGRES_URL: postgres://astra:astra@127.0.0.1:5432/astrasync?sslmode=disable
        run: go test -tags=integration -v -count=1 ./replication/adapters -run '^TestPostgreSQLStorePersistsEpochFenceAndPromotionLifecycle$'

      - name: Run replication runtime integration
        working-directory: control-plane
        env:
          ASTRASYNC_TEST_POSTGRES_URL: postgres://astra:astra@127.0.0.1:5432/astrasync?sslmode=disable
        run: go test -tags=integration -v -count=1 ./replication/runtime -run '^TestRuntimeAssemblesDeploymentAdaptersAndCloses$'

      - name: Run cross-region replication acceptance
        working-directory: control-plane/api-server
        env:
          ASTRASYNC_TEST_POSTGRES_URL: postgres://astra:astra@127.0.0.1:5432/astrasync?sslmode=disable
        run: go test -tags=integration -v -count=1 ./internal/replication -run '^TestCrossRegionReplicationAcceptanceCoversRetryRecoveryAndPromotionFence$'

  multi-region-acceptance:
    name: Multi-region Docker Compose acceptance
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.multi_region == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: tests/integration/go.mod

      - name: Run multi-region acceptance
        run: make test-integration-multi-region

      - name: Collect Compose logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          log_file="tests/integration/multi-region/test-logs/compose.log"
          mkdir -p "$(dirname "${log_file}")"
          if [[ ! -s "${log_file}" ]]; then
            docker compose -f tests/integration/multi-region/docker-compose.yaml logs --no-color >"${log_file}" 2>&1 || true
          fi

      - name: Upload Compose logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: multi-region-compose-logs
          path: tests/integration/multi-region/test-logs
          if-no-files-found: ignore

      - name: Ensure Compose resources are removed
        if: always()
        shell: bash
        run: docker compose -f tests/integration/multi-region/docker-compose.yaml down -v --remove-orphans || true

  protocols:
    name: Protocol and YAML validation
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.x'
          cache: false

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ github.token }}
          version: '1.34.0'

      - name: Validate XML and protobuf modules
        run: mvn -B -ntp -pl protocol -am validate

      - name: Lint control-plane protobuf
        run: buf lint api/protobuf

      - name: Install Go protobuf generators

        env:
          GOBIN: ${{ runner.temp }}/go-protobuf-bin
        run: |
          mkdir -p "${GOBIN}"
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.34.2
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.4.0
          go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-grpc-gateway@v2.20.0
          echo "${GOBIN}" >> "${GITHUB_PATH}"

      - name: Check generated control-plane protocol
        run: |
          buf generate api/protobuf --template buf.gen.yaml
          git diff --exit-code -- control-plane/api-server/gen/go

      - name: Check generated SyncJob CRD
        working-directory: control-plane/controller
        run: |
          go run sigs.k8s.io/controller-tools/cmd/controller-gen@v0.21.0 crd paths=./api/v1 output:crd:artifacts:config=../../deployment/operator/config/crd/bases
          git diff --exit-code -- ../../deployment/operator/config/crd/bases/sync.astrasync.io_syncjobs.yaml

      - name: Set up Helm
        if: needs.changes.outputs.helm == 'true'
        uses: azure/setup-helm@59b1c81c6280f5abebb1fb1bc585696daa7dfb42 # v5
        with:
          version: v3.15.4

      - name: Lint Helm chart
        if: needs.changes.outputs.helm == 'true'
        run: helm lint deployment/helm/astrasync

      - name: Lint and render dynamic and manual execution modes
        if: needs.changes.outputs.helm == 'true'
        run: |
          helm template astrasync deployment/helm/astrasync > /dev/null
          helm lint deployment/helm/astrasync \
            --set scheduler.enabled=false \
            --set worker.enabled=true \
            --set coordinator.enabled=true \
            --set jobSpec.existingSecret=job-spec \
            --set coordinator.progress.existingClaim=progress
          helm template astrasync deployment/helm/astrasync \
            --set scheduler.enabled=false \
            --set worker.enabled=true \
            --set coordinator.enabled=true \
            --set jobSpec.existingSecret=job-spec \
            --set coordinator.progress.existingClaim=progress > /dev/null

      - name: Render observability toggles
        if: needs.changes.outputs.helm == 'true'
        # Phase 7 Slice 26 follow-up: verifies the metrics wiring is
        # fail-closed (no metrics containerPort / METRICS_LISTEN_ADDRESS
        # when monitoring.prometheus.enabled is false) and that turning the
        # toggle on emits the metrics containerPort, env var, and Service
        # port. The ServiceMonitor is exercised by enabling both toggles.
        run: |
          set -euo pipefail
          # Fail-closed: with the toggle off, no metrics containerPort and no METRICS_LISTEN_ADDRESS
          off_render="$(helm template astrasync deployment/helm/astrasync \
            --set apiServer.enabled=true \
            --set scheduler.enabled=true \
            --set console.enabled=true \
            --set connectionTestExecutor.enabled=true \
            --set monitoring.prometheus.enabled=false)"
          if echo "${off_render}" | grep -q 'METRICS_LISTEN_ADDRESS'; then
            echo "::error::METRICS_LISTEN_ADDRESS leaked when monitoring.prometheus.enabled=false"
            exit 1
          fi
          if echo "${off_render}" | grep -q 'name: metrics'; then
            echo "::error::metrics containerPort leaked when monitoring.prometheus.enabled=false"
            exit 1
          fi
          log_level_count="$(echo "${off_render}" | grep -c 'name: LOG_LEVEL' || true)"
          if [[ "${log_level_count}" -ne 4 ]]; then
            echo "::error::expected LOG_LEVEL for 4 observability-enabled components, got ${log_level_count}"
            exit 1
          fi
          # Toggle on: metrics containerPort, env var, and service port are emitted
          on_render="$(helm template astrasync deployment/helm/astrasync \
            --set apiServer.enabled=true \
            --set scheduler.enabled=true \
            --set console.enabled=true \
            --set connectionTestExecutor.enabled=true \
            --set monitoring.prometheus.enabled=true)"
          for needle in 'containerPort: 9090' 'METRICS_LISTEN_ADDRESS' 'name: metrics'; do
            if ! echo "${on_render}" | grep -q "${needle}"; then
              echo "::error::expected '${needle}' in rendered manifest when monitoring.prometheus.enabled=true"
              exit 1
            fi
          done
          # ServiceMonitor toggle: emits ServiceMonitor resources when both toggles are on
          sm_render="$(helm template astrasync deployment/helm/astrasync \
            --set apiServer.enabled=true \
            --set scheduler.enabled=true \
            --set console.enabled=true \
            --set monitoring.prometheus.enabled=true \
            --set monitoring.prometheus.serviceMonitor.enabled=true)"
          sm_count="$(echo "${sm_render}" | grep -c '^kind: ServiceMonitor' || true)"
          if [[ "${sm_count}" -lt 3 ]]; then
            echo "::error::expected at least 3 ServiceMonitor resources, got ${sm_count}"
            exit 1
          fi

      - name: Lint and render production profile
        if: needs.changes.outputs.helm == 'true'
        # Phase 13 Slice 30 follow-up: ensure values-production.yaml (and any
        # chart change touching it) keeps linting and rendering clean. Also
        # asserts the production profile's load-bearing defaults actually flow
        # into the manifest, so a future chart refactor cannot silently drop
        # HPA / PDB / NetworkPolicy / mtls wiring for production tenants.
        run: |
          set -euo pipefail
          chart=deployment/helm/astrasync
          prod_values="${chart}/values-production.yaml"

          # 1. Static lint with production values applied (schema + template refs).
          helm lint "${chart}" -f "${prod_values}"

          # 2. Full render with production values must succeed end-to-end.
          #    Strip CR first: helm template emits CRLF on Windows checkouts,
          #    which breaks downstream line-anchored grep / awk assertions.
          prod_render="$(helm template astrasync "${chart}" -f "${prod_values}" | tr -d '\r')"
          echo "${prod_render}" > /dev/null

          # 3. The production environment marker must reach at least one component;
          #    otherwise values-production.yaml is being silently ignored.
          #    Templates render this as the value of an ENVIRONMENT env var,
          #    e.g. `name: ENVIRONMENT` followed by `value: production`.
          prod_marker_count="$(echo "${prod_render}" | grep -cE '^[[:space:]]+value:[[:space:]]+"?production"?$' || true)"
          if [[ "${prod_marker_count}" -lt 1 ]]; then
            echo "::error::values-production.yaml did not propagate 'environment: production' to any component"
            exit 1
          fi

          # 4. Production-only safety nets from values-production.yaml must render.
          #    HPA + PDB are toggled by replicaCount>1 / podDisruptionBudget blocks;
          #    NetworkPolicy is the prod-only cluster hardening; mtls surfaces
          #    the cert secret volume on api-server. Missing any of these means
          #    the production profile regressed.
          for needle in 'kind: HorizontalPodAutoscaler' 'kind: PodDisruptionBudget' 'kind: NetworkPolicy' 'astrasync-api-server-mtls'; do
            if ! echo "${prod_render}" | grep -q "${needle}"; then
              echo "::error::expected '${needle}' in production render; values-production.yaml invariants regressed"
              exit 1
            fi
          done

          # 5. Sanity: replicaCount=3 must reach api-server (no silent override
          #    from values.yaml's default 1).
          api_replicas="$(echo "${prod_render}" \
            | awk '/^# Source: astrasync\/templates\/api-server\/deployment.yaml/{flag=1; next} /^---/{flag=0} flag' \
            | grep -E '^[[:space:]]+replicas:' \
            | head -n1 | awk '{print $2}')"
          if [[ "${api_replicas}" != "3" ]]; then
            echo "::error::expected apiServer.replicas=3 under production profile, got '${api_replicas:-<missing>}'"
            exit 1
          fi

      - name: Lint and render staging profile
        if: needs.changes.outputs.helm == 'true'
        # Phase 14 Slice 40 follow-up: ensure values-staging.yaml stays in
        # parity with the chart. Asserts that staging toggle defaults actually
        # flow into the manifest (PDB on, autoscaling off, NetworkPolicy off,
        # environment=staging, DEBUG logging). Mirrors the production profile
        # step so the two profiles cannot silently drift apart.
        run: |
          set -euo pipefail
          chart=deployment/helm/astrasync
          staging_values="${chart}/values-staging.yaml"

          helm lint "${chart}" -f "${staging_values}"

          staging_render="$(helm template astrasync "${chart}" -f "${staging_values}" | tr -d '\r')"
          echo "${staging_render}" > /dev/null

          # 3 PDBs (api-server, controller, scheduler; compiler-validation not
          # expected because PDB.enabled stays on but compiler-validation.minAvailable=1
          # is exposed via values-staging.yaml; we count the 3 control-plane PDBs).
          pdb_count="$(echo "${staging_render}" | grep -c '^kind: PodDisruptionBudget' || true)"
          if [[ "${pdb_count}" -ne 3 ]]; then
            echo "::error::expected 3 PDBs from staging values, got ${pdb_count}"
            exit 1
          fi

          # Autoscaling off → 0 HPAs.
          hpa_count="$(echo "${staging_render}" | grep -c '^kind: HorizontalPodAutoscaler' || true)"
          if [[ "${hpa_count}" -ne 0 ]]; then
            echo "::error::expected 0 HPAs from staging values, got ${hpa_count}"
            exit 1
          fi

          # NetworkPolicy off in staging.
          np_count="$(echo "${staging_render}" | grep -c '^kind: NetworkPolicy' || true)"
          if [[ "${np_count}" -ne 0 ]]; then
            echo "::error::expected 0 NetworkPolicies from staging values, got ${np_count}"
            exit 1
          fi

          # environment=staging must reach at least one container env.
          env_count="$(echo "${staging_render}" | grep -cE '^[[:space:]]+value:[[:space:]]+"?staging"?$' || true)"
          if [[ "${env_count}" -lt 1 ]]; then
            echo "::error::values-staging.yaml did not propagate 'environment: staging' to any component"
            exit 1
          fi

          # DEBUG log level must reach at least one container env.
          debug_count="$(echo "${staging_render}" | grep -cE '^[[:space:]]+value:[[:space:]]+"?DEBUG"?$' || true)"
          if [[ "${debug_count}" -lt 1 ]]; then
            echo "::error::DEBUG log level did not propagate from values-staging.yaml"
            exit 1
          fi

      - name: Validate ArgoCD CR schema
        if: needs.changes.outputs.helm == 'true'
        # Phase 14 Slice 40 follow-up: confirm the ArgoCD Application,
        # ApplicationSet, and namespace manifests are syntactically valid YAML
        # and parse with the kubectl client-side schema. A kubectl cluster is
        # not available in CI, so the step parses locally and checks for the
        # expected top-level keys.
        run: |
          set -euo pipefail

          argocd_dir=deployment/argocd

          for f in ${argocd_dir}/application.yaml ${argocd_dir}/applicationset.yaml ${argocd_dir}/namespace.yaml; do
            if ! python -c "import yaml,sys; docs=list(yaml.safe_load_all(open(sys.argv[1]))); assert docs, 'no docs'" "${f}"; then
              echo "::error::ArgoCD manifest ${f} failed to parse as YAML"
              exit 1
            fi
          done

          # Verify the Application declares the expected top-level spec keys.
          python - <<'PY'
          import yaml, sys
          with open('deployment/argocd/application.yaml') as f:
              app = yaml.safe_load(f)
          assert app['kind'] == 'Application', f"kind={app.get('kind')}"
          assert app['spec']['source']['path'] == 'deployment/helm/astrasync'
          assert 'values-production.yaml' in app['spec']['source']['helm']['valueFiles']
          assert app['spec']['syncPolicy']['automated']['prune'] is True
          assert app['spec']['syncPolicy']['automated']['selfHeal'] is True

          with open('deployment/argocd/applicationset.yaml') as f:
              appset = yaml.safe_load(f)
          assert appset['kind'] == 'ApplicationSet'
          assert appset['spec']['generators'][0]['matrix'] is not None
          gen = appset['spec']['generators'][0]['matrix']['generators']
          assert any('clusters' in g for g in gen), 'expected cluster generator'
          assert any('git' in g for g in gen), 'expected git generator'

          with open('deployment/argocd/namespace.yaml') as f:
              for doc in yaml.safe_load_all(f):
                  if doc and doc.get('kind') == 'Role':
                      rules = doc['rules']
                      api_groups = {g for r in rules for g in r.get('apiGroups', [])}
                      assert 'argoproj.io' in api_groups
                      verbs = {v for r in rules for v in r.get('verbs', [])}
                      assert 'create' in verbs and 'delete' in verbs
                      # No secrets access granted.
                      for r in rules:
                          assert 'secrets' not in r.get('resources', []), \
                              "Role must not grant secrets access"
          print('ArgoCD manifests validated')
          PY

  security:
    name: Repository security checks
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: |
            control-plane/go.mod
            control-plane/api-server/go.mod
            control-plane/auth/go.mod
            console/go.mod

      - name: Run transport security gate
        # Runs check-security, which depends on check-mtls for Phase 7
        # Slice 23 control-plane mutual TLS verification.
        run: make check-security

  runbooks:
    name: Operational runbook template guard
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Run runbook template gate
        # Runs check-runbooks, which verifies every Markdown file under
        # docs/runbooks/ is a template (contains a <placeholder> and no
        # production hostname patterns). Phase 7 Slice 24.
        run: make check-runbooks

      - name: Run script unit tests
        run: make test-scripts

  container-images:
    name: Build ${{ matrix.name }} image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API Server
            file: deployment/docker/Dockerfile.api
            tag: astrasync/api-server:ci
          - name: Compiler Validation
            file: deployment/docker/Dockerfile.compiler-validation
            tag: astrasync/compiler-validation:ci
          - name: Controller
            file: deployment/docker/Dockerfile.controller
            tag: astrasync/controller:ci
          - name: Scheduler
            file: deployment/docker/Dockerfile.scheduler
            tag: astrasync/scheduler:ci
          - name: Connection Test Executor
            file: deployment/docker/Dockerfile.connection-test-executor
            tag: astrasync/connection-test-executor:ci
          - name: Console
            file: deployment/docker/Dockerfile.console
            tag: astrasync/console:ci
          - name: Coordinator
            file: deployment/docker/Dockerfile.coordinator
            tag: astrasync/coordinator:ci
          - name: Worker
            file: deployment/docker/Dockerfile.worker
            tag: astrasync/worker:ci
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          tags: ${{ matrix.tag }}

  repository:
    name: Repository policy checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f CONTRIBUTING.md
          test -f LICENSE
          test -f pom.xml
          test -f .commitlintrc
          test -f .githooks/commit-msg

      - name: Check for accidental secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_OPTS: -Dmaven.repo.local=${{ github.workspace }}/.m2/repository

jobs:
  java:
    name: Java 21 Maven model validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate Maven reactor and dependencies
        run: mvn -B -ntp validate

  go:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module:
          - control-plane
          - control-plane/api-server
          - control-plane/controller
          - control-plane/scheduler
          - control-plane/catalog
          - control-plane/auth
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
          cache: true
          cache-dependency-path: |
            control-plane/go.mod
            control-plane/api-server/go.mod
            control-plane/controller/go.mod
            control-plane/scheduler/go.mod
            control-plane/catalog/go.mod
            control-plane/auth/go.mod

      - name: Download dependencies
        working-directory: ${{ matrix.module }}
        run: go mod download

      - name: Format check
        working-directory: ${{ matrix.module }}
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test ./...

  protocols:
    name: Protocol and YAML validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate XML and protobuf modules
        run: mvn -B -ntp -pl protocol -am validate

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Lint Helm chart
        run: helm lint deployment/helm/astrasync

  repository:
    name: Repository policy checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f CONTRIBUTING.md
          test -f LICENSE
          test -f pom.xml
          test -f .commitlintrc
          test -f .githooks/commit-msg

      - name: Check for accidental secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

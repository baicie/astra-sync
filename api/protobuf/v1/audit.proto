syntax = "proto3";

package astra.control.v1;

import "google/protobuf/timestamp.proto";

option go_package = "io.astrasync/control-plane/api-server/gen/go/v1;jobv1";
option java_multiple_files = true;
option java_package = "io.astrasync.control.v1";
option java_outer_classname = "ControlPlaneAuditProto";

service AuditService {
  rpc ListAuditEvents(ListAuditEventsRequest) returns (ListAuditEventsResponse);
}

message ListAuditEventsRequest {
  string tenant_id = 1;
  google.protobuf.Timestamp occurred_after = 2;
  google.protobuf.Timestamp occurred_before = 3;
  repeated string event_types = 4;
  repeated string outcomes = 5;
  int32 page_size = 6;
  string page_token = 7;
}

message ListAuditEventsResponse {
  repeated AuditEvent events = 1;
  string next_page_token = 2;
  google.protobuf.Timestamp snapshot_time = 3;
}

message AuditEvent {
  string event_id = 1;
  string event_type = 2;
  string actor_id = 3;
  string request_id = 4;
  string outcome = 5;
  map<string, string> attributes = 6;
  google.protobuf.Timestamp occurred_at = 7;
}

syntax = "proto3";

package astra.control.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "v1/connector.proto";

option go_package = "io.astrasync/control-plane/api-server/gen/go/v1;jobv1";
option java_multiple_files = true;
option java_package = "io.astrasync.control.v1";
option java_outer_classname = "ControlPlaneJobProto";

service JobService {
  rpc CreateJob(CreateJobRequest) returns (Job);
  rpc GetJob(GetJobRequest) returns (Job);
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  rpc UpdateJob(UpdateJobRequest) returns (Job);
  rpc DeleteJob(DeleteJobRequest) returns (google.protobuf.Empty);
  rpc StartJob(StartJobRequest) returns (Job);
  rpc StopJob(StopJobRequest) returns (Job);
  rpc GetJobStatus(GetJobStatusRequest) returns (JobStatus);
}

service JobValidationService {
  rpc ValidateJobSpec(ValidateJobSpecRequest) returns (JobValidationResult);
}

message CreateJobRequest {
  string name = 1;
  string namespace = 2;
  JobSpec spec = 3;
  string idempotency_key = 4;
}

message GetJobRequest {
  string name = 1;
  string namespace = 2;
}

message ListJobsRequest {
  string namespace = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListJobsResponse {
  repeated Job items = 1;
  int32 total = 2;
}

message UpdateJobRequest {
  string name = 1;
  string namespace = 2;
  int64 expected_version = 3;
  JobSpec spec = 4;
  string idempotency_key = 5;
}

message DeleteJobRequest {
  string name = 1;
  string namespace = 2;
  int64 expected_version = 3;
  string idempotency_key = 4;
}

message StartJobRequest {
  string name = 1;
  string namespace = 2;
  int64 expected_version = 3;
  string idempotency_key = 4;
}

message StopJobRequest {
  string name = 1;
  string namespace = 2;
  int64 expected_version = 3;
  string idempotency_key = 4;
}

message GetJobStatusRequest {
  string name = 1;
  string namespace = 2;
}

message Job {
  string name = 1;
  string namespace = 2;
  string uid = 3;
  int64 version = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  JobSpec spec = 7;
  JobStatus status = 8;
}

message JobSpec {
  ConnectorConfig source = 1;
  ConnectorConfig sink = 2;
  repeated TransformConfig transforms = 3;
  DeliveryConfig delivery = 4;
  RuntimeConfig runtime = 5;
}

message ConnectorConfig {
  string connector = 1;
  string connection_ref = 2;
  map<string, string> options = 3;
}

message TransformConfig {
  string type = 1;
  map<string, string> options = 2;
}

message DeliveryConfig {
  DeliveryGuarantee guarantee = 1;
}

enum DeliveryGuarantee {
  DELIVERY_GUARANTEE_UNSPECIFIED = 0;
  DELIVERY_GUARANTEE_EXACTLY_ONCE = 1;
  DELIVERY_GUARANTEE_AT_LEAST_ONCE = 2;
  DELIVERY_GUARANTEE_AT_MOST_ONCE = 3;
}

message RuntimeConfig {
  int32 max_batch_records = 1;
}

message JobStatus {
  DesiredState desired_state = 1;
  JobState state = 2;
  int64 epoch = 3;
  int32 restart_count = 4;
  google.protobuf.Timestamp start_time = 5;
  google.protobuf.Timestamp end_time = 6;
  CheckpointInfo last_checkpoint = 7;
  FailureInfo failure = 8;
}

enum DesiredState {
  DESIRED_STATE_UNSPECIFIED = 0;
  DESIRED_STATE_STOPPED = 1;
  DESIRED_STATE_RUNNING = 2;
}

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_CREATED = 1;
  JOB_STATE_INITIALIZING = 2;
  JOB_STATE_RUNNING = 3;
  JOB_STATE_CANCELING = 4;
  JOB_STATE_CANCELED = 5;
  JOB_STATE_FINISHED = 6;
  JOB_STATE_FAILED = 7;
}

message CheckpointInfo {
  int64 id = 1;
  google.protobuf.Timestamp timestamp = 2;
  int64 state_size = 3;
  int32 duration_ms = 4;
}

message FailureInfo {
  string reason = 1;
  string root_cause = 2;
  google.protobuf.Timestamp timestamp = 3;
  string host = 4;
}

message ValidateJobSpecRequest {
  string namespace = 1;
  string name = 2;
  JobValidationPurpose purpose = 3;
  int64 expected_version = 4;
  JobSpec spec = 5;
}

enum JobValidationPurpose {
  JOB_VALIDATION_PURPOSE_UNSPECIFIED = 0;
  JOB_VALIDATION_PURPOSE_CREATE = 1;
  JOB_VALIDATION_PURPOSE_UPDATE = 2;
  JOB_VALIDATION_PURPOSE_START = 3;
}

message JobValidationResult {
  string validation_id = 1;
  bool valid = 2;
  string spec_digest = 3;
  string compiler_revision = 4;
  ConnectorExecutionMode execution_mode = 5;
  repeated JobValidationIssue issues = 6;
}

message JobValidationIssue {
  JobValidationIssueCode code = 1;
  JobValidationSeverity severity = 2;
  string field_path = 3;
  string message = 4;
  string documentation_key = 5;
}

enum JobValidationSeverity {
  JOB_VALIDATION_SEVERITY_UNSPECIFIED = 0;
  JOB_VALIDATION_SEVERITY_ERROR = 1;
  JOB_VALIDATION_SEVERITY_WARNING = 2;
}

enum JobValidationIssueCode {
  JOB_VALIDATION_ISSUE_CODE_UNSPECIFIED = 0;
  JOB_VALIDATION_ISSUE_CODE_STRUCTURE_INVALID = 1;
  JOB_VALIDATION_ISSUE_CODE_CONNECTOR_NOT_FOUND = 2;
  JOB_VALIDATION_ISSUE_CODE_ROLE_UNSUPPORTED = 3;
  JOB_VALIDATION_ISSUE_CODE_CAPABILITY_MISSING = 4;
  JOB_VALIDATION_ISSUE_CODE_TRANSFORM_UNSUPPORTED = 5;
  JOB_VALIDATION_ISSUE_CODE_DELIVERY_UNSUPPORTED = 6;
  JOB_VALIDATION_ISSUE_CODE_OPTION_UNKNOWN = 7;
  JOB_VALIDATION_ISSUE_CODE_OPTION_REQUIRED = 8;
  JOB_VALIDATION_ISSUE_CODE_OPTION_INVALID = 9;
  JOB_VALIDATION_ISSUE_CODE_CONNECTION_REF_REQUIRED = 10;
  JOB_VALIDATION_ISSUE_CODE_CONNECTION_REF_UNAVAILABLE = 11;
  JOB_VALIDATION_ISSUE_CODE_VALIDATION_REVISION_CHANGED = 12;
  JOB_VALIDATION_ISSUE_CODE_ISSUES_TRUNCATED = 13;
}

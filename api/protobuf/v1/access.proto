syntax = "proto3";

package astra.control.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "v1/identity.proto";

option go_package = "io.astrasync/control-plane/api-server/gen/go/v1;jobv1";
option java_multiple_files = true;
option java_package = "io.astrasync.control.v1";
option java_outer_classname = "ControlPlaneAccessProto";

// AccessService manages tenant-scoped membership and platform-level role
// grants. The service writes both the membership/role row and the matching
// audit event in the same transaction; the audit write is not optional.
service AccessService {
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  rpc GrantTenantRole(GrantTenantRoleRequest) returns (TenantMembership);
  rpc RevokeTenantRole(RevokeTenantRoleRequest) returns (google.protobuf.Empty);
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  rpc GrantPlatformRole(GrantPlatformRoleRequest) returns (PlatformRoleGrant);
  rpc RevokePlatformRole(RevokePlatformRoleRequest) returns (google.protobuf.Empty);
  // RevokeConsoleSession deletes every active Console session for the given
  // principal. The call is idempotent: a second call with the same
  // principal_id and idempotency_key is a no-op (the audit row is recorded
  // once and the session deletes are skipped). The handler invokes
  // authpostgres.Repository.RevokeSessionsForPrincipal in a serializable
  // transaction (mirrors Phase 22 / ADR-065) and emits
  // apiserver_session_revoke_total once per unique active tenant the target
  // principal holds a membership in. The actor_id label is the
  // authenticated caller's principal UUID; tenant_id is the active tenant.
  //
  // Required role: platform_admin (mirrors RevokePlatformRole). Tenant-level
  // admins cannot invoke this RPC; they continue to use the admin CLI
  // revoke-session command documented in ADR-065.
  //
  // Idempotency: 16-128 chars, mirrors the access-service idempotency
  // contract (ADR-038).
  rpc RevokeConsoleSession(RevokeConsoleSessionRequest) returns (RevokeConsoleSessionResponse);
}

message ListMembersRequest {
  string tenant_id = 1;
  string page_token = 2;
  int32 page_size = 3;
}

message ListMembersResponse {
  repeated TenantMember members = 1;
  string next_page_token = 2;
}

message TenantMember {
  string principal_id = 1;
  string issuer = 2;
  string subject = 3;
  string display_name = 4;
  string role = 5;
  bool active = 6;
  google.protobuf.Timestamp granted_at = 7;
  string granted_by = 8;
}

message GrantTenantRoleRequest {
  string tenant_id = 1;
  string principal_id = 2;
  string role = 3;
  // Expected tenant authorization revision captured from a previous read.
  // Used to fence against concurrent membership mutations.
  int64 expected_authz_revision = 4;
  string idempotency_key = 5;
}

message RevokeTenantRoleRequest {
  string tenant_id = 1;
  string principal_id = 2;
  int64 expected_authz_revision = 3;
  string idempotency_key = 4;
}

message ListRolesRequest {
  // Empty for now. Tenant_id is intentionally not part of the request because
  // roles are global; the response is the same for every caller.
}

message ListRolesResponse {
  repeated RoleDefinition roles = 1;
}

message RoleDefinition {
  string name = 1;
  repeated string permissions = 2;
  string description = 3;
}

message GrantPlatformRoleRequest {
  string principal_id = 1;
  string role = 2;
  string idempotency_key = 3;
}

message RevokePlatformRoleRequest {
  string principal_id = 1;
  string role = 2;
  string idempotency_key = 3;
}

message PlatformRoleGrant {
  string principal_id = 1;
  string role = 2;
  bool active = 3;
  google.protobuf.Timestamp granted_at = 4;
  string granted_by = 5;
}

message RevokeConsoleSessionRequest {
  // Canonical lowercase UUID of the target principal. The handler validates
  // the format (mirrors tenantIDPatternFromString in the access service).
  string principal_id = 1;
  // Idempotency key, 16-128 chars (ADR-038).
  string idempotency_key = 2;
}

message RevokeConsoleSessionResponse {
  // Number of Console sessions deleted. Zero if the principal had no active
  // sessions or the call was a replay of an earlier idempotency-key call.
  int64 sessions_revoked = 1;
  // Number of distinct active tenants the target principal held memberships
  // in at the moment of the revoke. Matches the apiserver_session_revoke_total
  // series count emitted by the handler.
  int32 tenant_count = 2;
}

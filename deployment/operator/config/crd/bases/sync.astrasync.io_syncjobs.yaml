                  type: object
                  properties:
                    initial:
                      type: integer
                    min:
                      type: integer
                    max:
                      type: integer
                checkpoint:
                  type: object
                  properties:
                    interval:
                      type: string
                    timeout:
                      type: string
                state:
                  type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                jobId:
                  type: string
                epoch:
                  type: integer
                currentAttempt:
                  type: integer
                restartCount:
                  type: integer
                startTime:
                  type: string

      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                source:
                  type: object
                  properties:
                    connector:
                      type: string
                    connectionRef:
                      type: string
                    tables:
                      type: object

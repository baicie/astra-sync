apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: syncjobs.sync.astrasync.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
spec:
  group: sync.astrasync.io
  names:
    kind: SyncJob
    listKind: SyncJobList
    plural: syncjobs
    singular: syncjob
    shortNames:

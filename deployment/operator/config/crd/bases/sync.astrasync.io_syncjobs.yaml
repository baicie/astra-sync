---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: syncjobs.sync.astrasync.io
spec:
  group: sync.astrasync.io
  names:
    kind: SyncJob
    listKind: SyncJobList
    plural: syncjobs
    shortNames:
    - sj
    singular: syncjob
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.state
      name: Desired
      type: string
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .status.epoch
      name: Epoch
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          SyncJob represents a data synchronization job managed by the AstraSync
          controller. The following labels are required for observability:

            - astrasync.io/tenant-id: canonical lowercase UUID of the tenant that
              owns this job. Used by controller_job_state_total (ADR-066) and
              controller_epoch_fence_total (ADR-069) to label transitions per
              tenant. If absent, the controller emits _unknown for the tenant_id
              label.

          The label MUST be set by the caller at SyncJob creation time. Users
          creating SyncJob resources via kubectl MUST include the label.
          Applications creating SyncJob resources programmatically (e.g. the Console)
          MUST set the label from the authenticated principal's tenant context.

          The Kubernetes Namespace field is used as the Prometheus "namespace"
          label in controller_job_state_total. This is distinct from the
          astrasync.io/tenant-id label.

          The tenant-label contract requires:
           1. The label key 'astrasync.io/tenant-id' is present and non-empty.
           2. The label value matches the canonical lowercase UUID pattern.

          See ADR-029 (durable state machine), ADR-053 (production hardening),
          ADR-066 (controller emission slice 43.3.5), ADR-069 (epoch fence
          emission), ADR-071 (tenant-id label contract), ADR-086 (admission
          enforcement correction), and ADR-087 (ValidatingAdmissionPolicy).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              delivery:
                properties:
                  guarantee:
                    enum:
                    - at-most-once
                    - at-least-once
                    - exactly-once
                    type: string
                required:
                - guarantee
                type: object
              runtime:
                properties:
                  maxBatchRecords:
                    default: 1024
                    format: int32
                    minimum: 1
                    type: integer
                required:
                - maxBatchRecords
                type: object
              sink:
                properties:
                  connectionRef:
                    type: string
                  connector:
                    maxLength: 128
                    minLength: 1
                    pattern: ^[a-z0-9](?:[a-z0-9._-]*[a-z0-9])?$
                    type: string
                  options:
                    additionalProperties:
                      type: string
                    type: object
                required:
                - connector
                type: object
              source:
                properties:
                  connectionRef:
                    type: string
                  connector:
                    maxLength: 128
                    minLength: 1
                    pattern: ^[a-z0-9](?:[a-z0-9._-]*[a-z0-9])?$
                    type: string
                  options:
                    additionalProperties:
                      type: string
                    type: object
                required:
                - connector
                type: object
              state:
                default: STOPPED
                enum:
                - STOPPED
                - RUNNING
                type: string
              transforms:
                items:
                  properties:
                    options:
                      additionalProperties:
                        type: string
                      type: object
                    type:
                      type: string
                  required:
                  - type
                  type: object
                type: array
            required:
            - delivery
            - runtime
            - sink
            - source
            type: object
          status:
            properties:
              desiredState:
                enum:
                - STOPPED
                - RUNNING
                type: string
              endTime:
                format: date-time
                type: string
              epoch:
                format: int64
                type: integer
              failure:
                properties:
                  host:
                    type: string
                  reason:
                    type: string
                  rootCause:
                    type: string
                  timestamp:
                    format: date-time
                    type: string
                required:
                - reason
                - timestamp
                type: object
              lastCheckpoint:
                properties:
                  durationMs:
                    format: int32
                    type: integer
                  id:
                    format: int64
                    type: integer
                  stateSize:
                    format: int64
                    type: integer
                  timestamp:
                    format: date-time
                    type: string
                required:
                - durationMs
                - id
                - stateSize
                - timestamp
                type: object
              restartCount:
                format: int32
                type: integer
              startTime:
                format: date-time
                type: string
              state:
                enum:
                - CREATED
                - INITIALIZING
                - RUNNING
                - CANCELING
                - CANCELED
                - FINISHED
                - FAILED
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}

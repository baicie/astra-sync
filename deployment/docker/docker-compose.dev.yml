services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: astrasync
      POSTGRES_USER: astra
      POSTGRES_PASSWORD: astra
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/jdbc-demo.sql:/docker-entrypoint-initdb.d/001-jdbc-demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astra -d astrasync"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker-0:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.worker
    environment:
      ASTRASYNC_WORKER_ID: worker-0
      ASTRASYNC_TASK_FACTORY_PROVIDER: io.astrasync.engine.worker.JdbcWorkerTaskFactoryProvider
      ASTRASYNC_WORKER_JOB_SPEC: /etc/astrasync/job/job.yaml
      ASTRASYNC_WORKER_MAX_IN_FLIGHT_BATCHES: "1"
    ports:
      - "50051:50051"
    volumes:
      - ./examples/jdbc-job.yaml:/etc/astrasync/job/job.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy

  worker-1:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.worker
    environment:
      ASTRASYNC_WORKER_ID: worker-1
      ASTRASYNC_TASK_FACTORY_PROVIDER: io.astrasync.engine.worker.JdbcWorkerTaskFactoryProvider
      ASTRASYNC_WORKER_JOB_SPEC: /etc/astrasync/job/job.yaml
      ASTRASYNC_WORKER_MAX_IN_FLIGHT_BATCHES: "1"
    ports:
      - "50052:50051"
    volumes:
      - ./examples/jdbc-job.yaml:/etc/astrasync/job/job.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy

  coordinator:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.coordinator
    environment:
      ASTRASYNC_COORDINATOR_WORKERS: worker-0@worker-0:50051,worker-1@worker-1:50051
    volumes:
      - ./examples/jdbc-job.yaml:/etc/astrasync/job/job.yaml:ro
      - coordinator_progress:/var/lib/astrasync/progress
    depends_on:
      worker-0:
        condition: service_healthy
      worker-1:
        condition: service_healthy

volumes:
  postgres_data:
  coordinator_progress:

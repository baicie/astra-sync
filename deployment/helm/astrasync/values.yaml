# Default values for AstraSync.
# This is a YAML-formatted file.

replicaCount: 1

image:
  repository: astrasync/astrasync
  pullPolicy: IfNotPresent
  tag: "latest"

  apiServer:
    repository: astrasync/api-server
    tag: "latest"

  compilerValidation:
    repository: astrasync/compiler-validation
    tag: "latest"

  controller:
    repository: astrasync/controller
    tag: "latest"

  scheduler:
    repository: astrasync/scheduler
    tag: "latest"

  connectionTestExecutor:
    repository: astrasync/connection-test-executor
    tag: "latest"

  console:
    repository: astrasync/console
    tag: "latest"

  worker:
    repository: astrasync/worker
    tag: "latest"

  coordinator:
    repository: astrasync/coordinator
    tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: true

# PostgreSQL configuration
postgresql:
  enabled: true
  auth:
    database: astrasync
    username: astra
    password: ""
  primary:
    persistence:
      enabled: true
      size: 10Gi
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 256Mi

# etcd configuration
etcd:
  enabled: true
  replicaCount: 3
  persistence:
    enabled: true
    size: 1Gi
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

# API Server configuration
apiServer:
  enabled: true
  replicaCount: 3
  environment: development
  auth:
    mode: disabled
    oidcIssuer: ""
    oidcAudience: ""
  catalog:
    executionProfile: standard
    inventoryPath: /app/catalog/connector-inventory.pb
    tokenKeySecretName: ""
    tokenKeySecretKey: token-key
  compilerValidation:
    endpoint: ""
    timeout: 3s
    tls:
      enabled: false
      secretName: ""
      certificateKey: client.crt
      privateKeyKey: client.key
      caKey: ca.crt
      serverName: compiler-validation
  mtls:
    enabled: false
    requireClientCert: true
    secretName: ""
    clientCAKey: ca.crt
  connectionTests:
    deadline: 30s
    # Map tenant UUIDs to private/protected CIDRs allowed for that tenant's probes.
    tenantEgressPolicies: {}
  # Rollout gates default closed. Enable each stage only after its verification gates pass.
  connectionRollout:
    mutationsEnabled: false
    testsEnabled: false
    runtimeEnabled: false
  tlsServerName: localhost
  service:
    type: ClusterIP
    port: 8080
    grpcPort: 50051
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: astrasync.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: false
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  config:
    databaseUrl: ""
    etcdEndpoints: ""

# Operator Console and OIDC backend-for-frontend. Production requires OIDC,
# an HTTPS public URL, a session-key Secret, and TLS to the API gRPC endpoint.
console:
  enabled: true
  replicaCount: 1
  environment: development
  namespace: ""
  developmentTenantId: 00000000-0000-4000-8000-000000000001
  publicUrl: ""
  auth:
    mode: disabled
    oidcIssuer: ""
    oidcAudience: ""
    clientId: ""
    scopes: "openid profile"
    clientSecret:
      secretName: ""
      key: client-secret
    sessionKey:
      secretName: ""
      key: session-key
    sessionIdleTtl: 30m
    sessionAbsoluteTtl: 8h
    loginTtl: 10m
  api:
    endpoint: ""
    tls:
      enabled: false
      secretName: ""
      caKey: ca.crt
      serverName: api-server
    clientCert:
      enabled: false
      certKey: tls.crt
      keyKey: tls.key
  serviceAccount:
    create: true
    annotations: {}
    name: ""
  service:
    type: ClusterIP
    port: 8090
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: console.astrasync.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Internal Java semantic compiler. Production requires mTLS on this workload-only service.
compilerValidation:
  enabled: true
  replicaCount: 2
  compilerBuild: 0.1.0-SNAPSHOT
  maxConcurrency: 32
  service:
    port: 50052
  serviceAccount:
    create: true
    annotations: {}
    name: ""
  tls:
    enabled: false
    secretName: ""
    certificateKey: tls.crt
    privateKeyKey: tls.key
    clientCAKey: ca.crt
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi

# Controller configuration
controller:
  enabled: true
  replicaCount: 3
  leaderElection:
    enabled: true
    leaseDuration: 15s
    renewDeadline: 10s
    retryPeriod: 5s
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 256Mi
  config:
    etcdEndpoints: ""
    workerNamespace: ""
    statusRefreshInterval: 5s

# Scheduler configuration
scheduler:
  enabled: true
  replicaCount: 3
  maxConcurrentJobs: 1
  leaseDuration: 30s
  heartbeatTimeout: 2m
  heartbeatIntervalMillis: 10000
  reconcileInterval: 5s
  operationTimeout: 10s
  connectionMaterialization:
    enabled: false
  service:
    port: 8082
  progress:
    existingClaim: ""
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 256Mi

# Isolated, database-backed Connection test queue consumer.
connectionTestExecutor:
  enabled: false
  namespace: ""
  createNamespace: true
  replicaCount: 1
  concurrency: 4
  claimBatch: 4
  claimInterval: 1s
  leaseDuration: 30s
  probeTimeout: 20s
  completionTimeout: 3s
  dialTimeout: 5s
  kubernetesTimeout: 5s
  maxDNSAnswers: 8
  dnsServer: ""
  protectedCIDRs: []
  serviceAccount:
    create: true
    annotations: {}
    name: ""
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
      ephemeral-storage: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
      ephemeral-storage: 64Mi
  quota:
    pods: "5"
    requestsCpu: "2"
    requestsMemory: 1Gi
    limitsCpu: "4"
    limitsMemory: 2Gi
  networkPolicy:
    enabled: true
    postgresqlPort: 5432
    # Override for clusters whose kubernetes.default Service IP differs.
    kubernetesApiCIDRs:
      - 10.96.0.1/32
    publicIPv4Egress: true
    additionalAllowedCIDRs: []

# Worker configuration
worker:
  # The standard Worker image contains the production JDBC provider and JDBC drivers.
  enabled: false
  replicaCount: 2
  slotsPerWorker: 4
  protocolPort: 50051
  taskFactoryProvider: io.astrasync.engine.worker.JdbcWorkerTaskFactoryProvider
  maxConcurrentTasks: 1
  taskQueueCapacity: 0
  maxConnections: 16
  maxInFlightBatches: 1
  resources:
    limits:
      cpu: 4000m
      memory: 8Gi
      ephemeral-storage: 50Gi
    requests:
      cpu: 1000m
      memory: 4Gi
      ephemeral-storage: 10Gi
  jvm:
    heapSize: 4g
    directMemory: 2g
    gc: "G1GC"
  config:
    coordinatorAddress: ""
    etcdEndpoints: ""
    objectStorage:
      endpoint: ""
      bucket: astrasync-checkpoints
      accessKey: ""
      secretKey: ""

# One-shot distributed JDBC full-load Coordinator. A failed Job is retried against the same
# progress claim and resumes only unfinished splits.
coordinator:
  enabled: false
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  workerTimeoutMillis: 30000
  maxInFlightTasks: 1
  progress:
    existingClaim: ""
    mountPath: /var/lib/astrasync/progress
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi
  jvm:
    heapSize: 768m
    gc: G1GC

# Object Storage configuration
objectStorage:
  enabled: false
  type: minio  # minio, s3, oss, hdfs
  endpoint: ""
  region: ""
  bucket: astrasync-checkpoints
  accessKey: ""
  secretKey: ""
  persistence:
    enabled: true
    size: 100Gi

# Network policy
networkPolicy:
  enabled: false
  apiServer:
    enabled: true
    allowedSources: []
  controller:
    enabled: true
    allowedSources: []
  worker:
    enabled: true
    allowedSources: []

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  apiServer:
    minAvailable: 2
  controller:
    minAvailable: 2
  scheduler:
    minAvailable: 2

# Pod anti-affinity
podAntiAffinity:
  enabled: true
  topologyKey: kubernetes.io/hostname

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Security context
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

# Container security context
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Persistence
persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi

# Monitoring
monitoring:
  enabled: false
  prometheus:
    enabled: true
    port: 9090
  grafana:
    enabled: false
    adminUser: admin
    adminPassword: ""

# Logging
logging:
  level: INFO
  pattern: "%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{1}] %m%n"
  output: stdout

# TLS configuration
tls:
  enabled: false
  secretName: ""
  certManager:
    enabled: false
    issuerRef:
      name: ""
      kind: ""

# Secrets
secrets:
  enabled: true
  vault:
    enabled: false
    address: ""
    authMethod: kubernetes  # kubernetes, token, approle
    role: ""
    kubernetes:
      serviceAccount: ""

# Service monitor for Prometheus
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  namespace: ""

# Priority class
priorityClassName: ""

# Immutable JobSpec shared by the Coordinator and all Workers.
jobSpec:
  existingSecret: ""
  key: job.yaml
  mountPath: /etc/astrasync/job

# Worker Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "astrasync.fullname" . }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "astrasync.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "astrasync.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "astrasync.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: {{ include "astrasync.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: worker
          image: "{{ .Values.image.worker.repository }}:{{ .Values.image.worker.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: data
              containerPort: 50051
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 5
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          env:
            - name: ROLE
              value: "worker"
            - name: WORKER_SLOTS
              value: "{{ .Values.worker.slotsPerWorker }}"
            - name: ETCD_ENDPOINTS
              value: {{ include "astrasync.etcd.endpoints" . }}
            - name: OBJECT_STORAGE_ENDPOINT
              value: {{ .Values.objectStorage.endpoint }}
            - name: OBJECT_STORAGE_BUCKET
              value: {{ .Values.objectStorage.bucket }}
            - name: JAVA_OPTS
              value: >-
                -Xmx{{ .Values.worker.jvm.heapSize }}
                -XX:+Use{{ .Values.worker.jvm.gc }}
                -XX:MaxDirectMemorySize={{ .Values.worker.jvm.directMemory }}
          volumeMounts:
            - name: scratch
              mountPath: /tmp
            - name: pod-info
              mountPath: /etc/podinfo
      volumes:
        - name: scratch
          emptyDir: {}
        - name: pod-info
          downwardAPI:
            items:
              - path: "labels"
                fieldRef:
                  fieldPath: metadata.labels
      {{- if .Values.podAntiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: worker
                topologyKey: {{ .Values.podAntiAffinity.topologyKey }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

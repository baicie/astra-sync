{{- if .Values.worker.enabled }}
{{- $jobSpecSecret := required "jobSpec.existingSecret is required when worker.enabled=true" .Values.jobSpec.existingSecret }}
{{- $workerName := include "astrasync.workerFullname" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $workerName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "astrasync.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  serviceName: {{ $workerName }}
  podManagementPolicy: Parallel
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "astrasync.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "astrasync.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ include "astrasync.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: worker
          image: "{{ .Values.image.worker.repository }}:{{ .Values.image.worker.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: worker
              containerPort: {{ .Values.worker.protocolPort }}
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: worker
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            tcpSocket:
              port: worker
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          env:
            - name: ASTRASYNC_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ASTRASYNC_WORKER_PORT
              value: {{ .Values.worker.protocolPort | quote }}
            - name: ASTRASYNC_TASK_FACTORY_PROVIDER
              value: {{ .Values.worker.taskFactoryProvider | quote }}
            - name: ASTRASYNC_WORKER_JOB_SPEC
              value: {{ printf "%s/job.yaml" .Values.jobSpec.mountPath | quote }}
            - name: ASTRASYNC_WORKER_MAX_IN_FLIGHT_BATCHES
              value: {{ .Values.worker.maxInFlightBatches | quote }}
            - name: ASTRASYNC_MAX_CONCURRENT_TASKS
              value: {{ .Values.worker.maxConcurrentTasks | quote }}
            - name: ASTRASYNC_TASK_QUEUE_CAPACITY
              value: {{ .Values.worker.taskQueueCapacity | quote }}
            - name: ASTRASYNC_MAX_CONNECTIONS
              value: {{ .Values.worker.maxConnections | quote }}
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -Xmx{{ .Values.worker.jvm.heapSize }}
                -XX:+Use{{ .Values.worker.jvm.gc }}
                -XX:MaxDirectMemorySize={{ .Values.worker.jvm.directMemory }}
          volumeMounts:
            - name: scratch
              mountPath: /tmp
            - name: job-spec
              mountPath: {{ .Values.jobSpec.mountPath }}
              readOnly: true
      volumes:
        - name: scratch
          emptyDir: {}
        - name: job-spec
          secret:
            secretName: {{ $jobSpecSecret }}
            items:
              - key: {{ .Values.jobSpec.key }}
                path: job.yaml
      {{- if .Values.podAntiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: worker
                topologyKey: {{ .Values.podAntiAffinity.topologyKey }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

{{- if and .Values.connectionTestExecutor.enabled .Values.connectionTestExecutor.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "astrasync.componentFullname" (dict "context" . "component" "connection-test") }}
  namespace: {{ include "astrasync.connectionTestExecutorNamespace" . }}
  labels:
    {{- include "astrasync.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "astrasync.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: connection-test-executor
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.connectionTestExecutor.networkPolicy.postgresqlPort }}
    {{- range .Values.connectionTestExecutor.networkPolicy.kubernetesApiCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
    {{- if .Values.connectionTestExecutor.networkPolicy.publicIPv4Egress }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 224.0.0.0/4
              - 240.0.0.0/4
    {{- end }}
    {{- range $tenantID, $cidrs := .Values.apiServer.connectionTests.tenantEgressPolicies }}
    {{- range $cidrs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
    {{- end }}
    {{- end }}
    {{- range .Values.connectionTestExecutor.networkPolicy.additionalAllowedCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
    {{- end }}
{{- end }}

{{- if and .Values.connectionTestExecutor.enabled .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "astrasync.componentFullname" (dict "context" . "component" "connection-test-secrets") }}
  labels:
    {{- include "astrasync.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "astrasync.componentFullname" (dict "context" . "component" "connection-test-secrets") }}
  labels:
    {{- include "astrasync.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "astrasync.componentFullname" (dict "context" . "component" "connection-test-secrets") }}
subjects:
  - kind: ServiceAccount
    name: {{ include "astrasync.connectionTestExecutorServiceAccountName" . }}
    namespace: {{ include "astrasync.connectionTestExecutorNamespace" . }}
{{- end }}

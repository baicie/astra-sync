<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AstraSync Console</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand-mark" aria-hidden="true">A</div>
        <div>
          <p class="eyebrow">ASTRASYNC</p>
          <h1>Console</h1>
        </div>
        <div class="topbar-spacer"></div>
        <div class="scope"><span class="scope-dot"></span><span id="scope-label">Loading scope</span></div>
        <button class="button button-quiet" id="refresh-button" type="button" title="Refresh jobs">Refresh</button>
      </header>

      <main class="content">
        <section class="page-heading">
          <div>
            <p class="eyebrow">OPERATIONS</p>
            <h2>Jobs</h2>
          </div>
          <div class="summary" id="summary">Loading...</div>
        </section>

        <section class="workspace" aria-label="Job operations">
          <div class="job-list-panel">
            <div class="panel-heading">
              <h3>Job inventory</h3>
              <span class="panel-meta" id="updated-label"></span>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr><th>Job</th><th>State</th><th>Desired</th><th>Pipeline</th><th>Version</th><th>Updated</th></tr>
                </thead>
                <tbody id="jobs-body"></tbody>
              </table>
            </div>
            <div class="empty-state" id="empty-state" hidden>
              <strong>No jobs in this namespace</strong>
              <span>The inventory is empty.</span>
            </div>
            <div class="error-state" id="list-error" hidden></div>
          </div>

          <aside class="detail-panel" id="detail-panel">
            <div class="detail-placeholder" id="detail-placeholder">
              <div class="placeholder-icon">+</div>
              <strong>Select a job</strong>
              <span>Job execution details will appear here.</span>
            </div>
            <div id="detail-content" hidden></div>
          </aside>
        </section>
      </main>
    </div>
    <script src="/app.js" defer></script>
  </body>
</html>

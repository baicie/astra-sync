services:
  compiler-validation-primary:
    build:
      context: ../../..
      dockerfile: deployment/docker/Dockerfile.compiler-validation
    image: astrasync/compiler-validation:integration
    environment:
      - APP_ENV=development
      - COMPILER_VALIDATION_PORT=50052
      - COMPILER_BUILD=0.8.0
      - CONNECTOR_EXECUTION_PROFILE=standard
    networks:
      - astrasync-primary

  compiler-validation-secondary:
    build:
      context: ../../..
      dockerfile: deployment/docker/Dockerfile.compiler-validation
    image: astrasync/compiler-validation:integration
    environment:
      - APP_ENV=development
      - COMPILER_VALIDATION_PORT=50052
      - COMPILER_BUILD=0.8.0
      - CONNECTOR_EXECUTION_PROFILE=standard
    networks:
      - astrasync-secondary

  # Primary region: us-east-1
  api-server-primary:
    build:
      context: ../../..
      dockerfile: deployment/docker/Dockerfile.api
    image: astrasync/api-server:integration
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgres://user:pass@postgres-primary:5432/astrasync?sslmode=disable
      - ASTRA_REPLICATION_RUNTIME_ENABLED=true
      - ASTRA_REPLICATION_OBJECT_STORE_ROOT=/var/lib/astrasync/replication
      - ASTRA_REPLICATION_WAL_PREFIX=replication/wal
      - ASTRA_REPLICATION_WAL_RESUME_FROM=0
      - COMPILER_VALIDATION_ENDPOINT=compiler-validation-primary:50052
      - GRPC_GATEWAY_ENDPOINT=api-server-primary:50051
      - HTTP_LISTEN_ADDRESS=:8080
      - GRPC_LISTEN_ADDRESS=:50051
      - ASTRA_REGION=us-east-1
      - ASTRA_ROLE=primary
      - ASTRA_PEER_REGION=us-west-1
      - ASTRA_PEER_ENDPOINT=api-server-secondary:50051
    ports:
      - "50051:50051"
      - "8080:8080"
    volumes:
      - ./certs:/certs:ro
      - ./data/primary:/var/lib/astrasync/replication
    networks:
      - astrasync-primary
      - astrasync-cross-region
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/ready"]
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on:
      postgres-primary:
        condition: service_healthy
      compiler-validation-primary:
        condition: service_started

  postgres-primary:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=astrasync
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
    networks:
      - astrasync-primary
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d astrasync"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Secondary region: us-west-1
  api-server-secondary:
    build:
      context: ../../..
      dockerfile: deployment/docker/Dockerfile.api
    image: astrasync/api-server:integration
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgres://user:pass@postgres-secondary:5432/astrasync?sslmode=disable
      - ASTRA_REPLICATION_RUNTIME_ENABLED=true
      - ASTRA_REPLICATION_OBJECT_STORE_ROOT=/var/lib/astrasync/replication
      - ASTRA_REPLICATION_WAL_PREFIX=replication/wal
      - ASTRA_REPLICATION_WAL_RESUME_FROM=0
      - COMPILER_VALIDATION_ENDPOINT=compiler-validation-secondary:50052
      - GRPC_GATEWAY_ENDPOINT=api-server-secondary:50051
      - HTTP_LISTEN_ADDRESS=:8080
      - GRPC_LISTEN_ADDRESS=:50051
      - ASTRA_REGION=us-west-1
      - ASTRA_ROLE=secondary
      - ASTRA_PEER_REGION=us-east-1
      - ASTRA_PEER_ENDPOINT=api-server-primary:50051
    ports:
      - "15061:50051"
      - "8081:8080"
    volumes:
      - ./certs:/certs:ro
      - ./data/secondary:/var/lib/astrasync/replication
    networks:
      - astrasync-secondary
      - astrasync-cross-region
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/ready"]
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on:
      postgres-secondary:
        condition: service_healthy
      compiler-validation-secondary:
        condition: service_started

  postgres-secondary:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=astrasync
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
    networks:
      - astrasync-secondary
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d astrasync"]
      interval: 2s
      timeout: 5s
      retries: 15

networks:
  astrasync-primary:
    driver: bridge
  astrasync-secondary:
    driver: bridge
  astrasync-cross-region:
    driver: bridge
